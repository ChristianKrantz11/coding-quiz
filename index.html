<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A timed JavaScript fundamentals quiz with a high-score board.">
    <title>Coding Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <button id="view-highscores" class="link-btn" type="button">View high scores</button>
        <div id="timer" aria-live="off">Time: <span id="time-left">75</span></div>
    </header>

    <main class="container">
        <!-- Start screen -->
        <section id="start-screen" class="screen">
            <h1>Coding Quiz Challenge</h1>
            <p class="intro">
                Answer 7 JavaScript questions before the clock runs out.
                You have 75 seconds, and every wrong answer costs 10 seconds.
                Your score is the time you have left.
            </p>
            <button id="start-btn" class="btn" type="button">Start Quiz</button>
        </section>

        <!-- Question screen -->
        <section id="question-screen" class="screen hidden">
            <p id="progress" class="progress"></p>
            <h2 id="question-text"></h2>
            <div id="choices" class="choices"></div>
            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        </section>

        <!-- Game over screen -->
        <section id="end-screen" class="screen hidden">
            <h2>All done!</h2>
            <p id="final-score" class="final-score"></p>
            <form id="score-form" class="score-form">
                <label for="initials">Enter your initials:</label>
                <input type="text" id="initials" maxlength="3" autocomplete="off" required>
                <button class="btn" type="submit">Save Score</button>
            </form>
            <p id="initials-error" class="error" role="alert"></p>
        </section>

        <!-- High scores screen -->
        <section id="highscores-screen" class="screen hidden">
            <h2>High Scores</h2>
            <ol id="highscore-list" class="highscore-list"></ol>
            <p id="no-scores" class="muted hidden">No high scores yet. Be the first!</p>
            <div class="btn-row">
                <button id="back-btn" class="btn" type="button">Main Menu</button>
                <button id="clear-btn" class="btn btn-secondary" type="button">Clear High Scores</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
